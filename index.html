document.querySelectorAll('#modeTabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;updateMode()});['toggleLabels','toggleNodes','toggleLens','toggleRelations'].forEach(id=>document.getElementById(id).onchange=()=>applyState());
const search=document.getElementById('search'),res=document.getElementById('results');search.oninput=()=>{const q=search.value.trim().toLowerCase();if(!q){res.classList.add('hidden');return}const a=industries.filter(d=>d.industry.toLowerCase().includes(q)).slice(0,9);res.innerHTML=a.map(d=>`<button data-id="${d.id}">${d.industry}<small>${d.sector} · PE ${fmt(d.forwardPE)}×</small></button>`).join('');res.classList.toggle('hidden',!a.length);res.querySelectorAll('button').forEach(b=>b.onclick=()=>{selectIndustry(industries[+b.dataset.id]);res.classList.add('hidden');search.value=industries[+b.dataset.id].industry})};
function reset(){scale=1;panX=0;panY=0;applyTransform()}document.getElementById('resetView').onclick=reset;document.getElementById('resetView2').onclick=reset;document.getElementById('zoomIn').onclick=()=>{scale=Math.min(1.6,scale+.12);applyTransform()};document.getElementById('zoomOut').onclick=()=>{scale=Math.max(.72,scale-.12);applyTransform()};document.getElementById('showAll').onclick=showModal;document.getElementById('allIndustries').onclick=showModal;document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.add('hidden');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.add('hidden')};
const vp=document.getElementById('mapViewport');vp.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.72,Math.min(1.65,scale+(e.deltaY<0?.08:-.08)));applyTransform()},{passive:false});vp.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,px:panX,py:panY};vp.setPointerCapture(e.pointerId);vp.classList.add('dragging');document.getElementById('mapWorld').classList.add('dragging')};vp.onpointermove=e=>{if(!drag)return;panX=drag.px+(e.clientX-drag.x);panY=drag.py+(e.clientY-drag.y);applyTransform()};vp.onpointerup=()=>{drag=null;vp.classList.remove('dragging');document.getElementById('mapWorld').classList.remove('dragging')};
</script>
</body></html>
