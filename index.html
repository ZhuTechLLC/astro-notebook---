  renderer.domElement.addEventListener("pointerdown",down);renderer.domElement.addEventListener("pointermove",move);renderer.domElement.addEventListener("pointerup",up);renderer.domElement.addEventListener("pointercancel",up);renderer.domElement.addEventListener("wheel",wheel,{passive:false});renderer.domElement.addEventListener("dblclick",reset);renderer.domElement.addEventListener("contextmenu",e=>e.preventDefault());
  let af;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;function loop(){af=requestAnimationFrame(loop);if(autoRotate&&!drag&&!reduce){ry+=.0008;g.rotation.y=ry}renderer.render(scene,cam)}loop();
  return()=>{cancelAnimationFrame(af);ro.disconnect();renderer.dispose();if(el.contains(renderer.domElement))el.removeChild(renderer.domElement)}
 },[activeNetwork,selected,showCross,autoRotate,resetKey]);
 return html`<div ref=${host} className="three-host"><div ref=${tip} className="tooltip"></div></div>`
}
