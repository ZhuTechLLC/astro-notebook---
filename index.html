<!doctype html>
<html lang="zh-CN">
<head>

<style>
:root{font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;color:#e8f3f7;background:#061018}
*{box-sizing:border-box}html,body,#root{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#102635 0,#061018 52%,#03070b 100%)}
button,input{font:inherit}.app{min-height:100vh;padding:14px;display:grid;grid-template-rows:auto 1fr;gap:12px}
.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border:1px solid #1e3946;border-radius:16px;background:#0a1822e8}
.eyebrow{font-size:10px;letter-spacing:.2em;color:#75d7ea;font-weight:800}.title{font-size:22px;font-weight:800;margin-top:3px}.sub{font-size:10px;color:#829ca7;margin-top:5px}
.metrics{display:flex;gap:8px;flex-wrap:wrap}.metric{min-width:110px;padding:8px 10px;border:1px solid #1a3440;border-radius:10px;background:#0d202b}.metric span{font-size:8px;color:#78919b;display:block}.metric b{font-size:14px;display:block;margin-top:3px}
.grid{display:grid;grid-template-columns:260px minmax(480px,1fr) 310px;gap:12px;min-height:680px}
.panel{border:1px solid #1b3440;border-radius:16px;background:#091720e8;overflow:hidden}.side{padding:14px}.section{font-size:12px;font-weight:800;margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #254451;background:#0b1c26;color:#90aab4;border-radius:999px;padding:6px 9px;font-size:9px;cursor:pointer}.chip.active{border-color:#6fd8ed;color:white;background:#12384a}
.range{width:100%}.hint{font-size:9px;line-height:1.6;color:#708995}.rank{display:grid;gap:7px;margin-top:9px}.rank button{border:1px solid #16313c;background:#0b1d27;color:#dcecf1;border-radius:10px;padding:8px;text-align:left;cursor:pointer}.rank b{display:block;font-size:11px}.rank small{display:block;color:#76909b;margin-top:3px;font-size:8px}
.stage{position:relative;min-height:680px;background:linear-gradient(180deg,#06121a,#040b10);overflow:hidden}.stage canvas{width:100%;height:100%;display:block;touch-action:none}.legend{position:absolute;left:12px;bottom:12px;background:#06141dcc;border:1px solid #1e3a46;border-radius:10px;padding:8px 10px;font-size:8px;color:#9ab1ba;line-height:1.65}.tooltip{position:absolute;pointer-events:none;display:none;padding:6px 8px;border-radius:8px;background:#06141dee;border:1px solid #31515e;font-size:9px;color:white}
.detail{padding:14px;overflow:auto}.ticker{font-size:28px;font-weight:900}.company{font-size:11px;color:#8ea5af}.badge{display:inline-block;margin-top:8px;padding:4px 7px;border-radius:999px;border:1px solid #caa94d;color:#efd16e;font-size:8px}
.score{font-size:36px;font-weight:900;margin:14px 0 2px}.scorelab{font-size:9px;color:#6f8c97}.bars{display:grid;gap:10px;margin-top:16px}.barrow{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:9px;color:#9eb2ba}.track{height:7px;background:#102833;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2da9c8,#86e5ba)}.notes{margin-top:16px;padding-top:12px;border-top:1px solid #17303a;font-size:9px;color:#8da6af;line-height:1.65}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.stage{min-height:520px}.side,.detail{min-height:auto}}
</style>
</head>
<body><div id="root"></div>
<script type="module">
import React,{useEffect,useMemo,useRef,useState} from "https://esm.sh/react@19.1.1";
import {createRoot} from "https://esm.sh/react-dom@19.1.1/client";
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.179.1/+esm";
const h=React.createElement;
const stocks=[
{t:"NVDA",n:"NVIDIA",s:"半导体",v:74,q:94,c:88,e:95,a:96},
{t:"TSM",n:"TSMC",s:"半导体",v:79,q:96,c:77,e:94,a:91},
{t:"MU",n:"Micron",s:"半导体",v:70,q:81,c:84,e:87,a:86},
{t:"CRWD",n:"CrowdStrike",s:"软件",v:55,q:90,c:91,e:91,a:90},
{t:"PLTR",n:"Palantir",s:"软件",v:43,q:86,c:90,e:87,a:84},
{t:"TEM",n:"Tempus AI",s:"医疗科技",v:48,q:76,c:89,e:77,a:82},
{t:"LLY",n:"Eli Lilly",s:"医疗健康",v:56,q:93,c:79,e:96,a:87},
{t:"GEV",n:"GE Vernova",s:"工业/电力",v:61,q:88,c:92,e:90,a:91},
{t:"VST",n:"Vistra",s:"能源/电力",v:68,q:84,c:86,e:85,a:87},
{t:"CMA",n:"Comerica",s:"金融",v:72,q:68,c:65,e:82,a:69},
{t:"EA",n:"Electronic Arts",s:"消费/媒体",v:66,q:82,c:74,e:88,a:78},
{t:"ACVA",n:"ACV Auctions",s:"汽车科技",v:58,q:67,c:93,e:79,a:76}
];
const colors={"半导体":0x57b8ff,"软件":0x9c7cff,"医疗科技":0x57e0bd,"医疗健康":0x2ec27e,"工业/电力":0xffb454,"能源/电力":0xff785f,"金融":0xf2cf5b,"消费/媒体":0xe879c4,"汽车科技":0x66d0e8};
function makeSprite(txt,color="#d8f7ff"){
 const c=document.createElement("canvas"),x=c.getContext("2d");c.width=256;c.height=64;x.clearRect(0,0,256,64);x.font="700 28px system-ui";x.fillStyle=color;x.textAlign="center";x.fillText(txt,128,40);
 const tex=new THREE.CanvasTexture(c),mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false});const sp=new THREE.Sprite(mat);sp.scale.set(3.2,.8,1);return sp;
}
function ThreeMap({items,onSelect,selected}){
 const mount=useRef(null),tip=useRef(null);
 useEffect(()=>{
  const el=mount.current; if(!el)return;

  axis([-12,.02,0],[12,.02,0]);axis([0,.02,-12],[0,.02,12]);axis([0,0,0],[0,12,0]);
  const labels=[["低预期差",[-10,.4,-.5]],["高预期差",[10,.4,-.5]],["财富创造",[.2,10.5,0]],["状态/催化",[-.3,.4,10]]];
  labels.forEach(([t,p])=>{const s=makeSprite(t);s.position.set(...p);scene.add(s)});
  const meshes=[];items.forEach(d=>{
    const x=(d.v-50)/4.5,z=(d.c-50)/4.5,y=.7+d.q/11;
    const geo=new THREE.SphereGeometry(.28+d.a/260,24,16);const mat=new THREE.MeshStandardMaterial({color:colors[d.s]||0x78d6e8,roughness:.35,metalness:.18,emissive:(colors[d.s]||0x78d6e8),emissiveIntensity:selected===d.t?.24:.08});
    const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.userData=d;group.add(m);meshes.push(m);
    const stemGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,.05,z),new THREE.Vector3(x,y-.3,z)]);const stem=new THREE.Line(stemGeo,new THREE.LineBasicMaterial({color:colors[d.s]||0x78d6e8,transparent:true,opacity:.28}));group.add(stem);
    const sp=makeSprite(d.t);sp.position.set(x,y+.8,z);sp.scale.set(1.7,.42,1);group.add(sp);
  });
  let rx=-.18,ry=-.35,drag=false,px=0,py=0,dist=1;group.rotation.x=rx;group.rotation.y=ry;
  const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
  function size(){const w=el.clientWidth,hg=el.clientHeight;renderer.setSize(w,hg,false);cam.aspect=w/hg;cam.updateProjectionMatrix()}size();
  const ro=new ResizeObserver(size);ro.observe(el);
  function pick(ev,click=false){const r=renderer.domElement.getBoundingClientRect();mouse.x=((ev.clientX-r.left)/r.width)*2-1;mouse.y=-((ev.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,cam);const hit=ray.intersectObjects(meshes)[0];if(hit){renderer.domElement.style.cursor="pointer";tip.current.style.display="block";tip.current.style.left=(ev.clientX-r.left+12)+"px";tip.current.style.top=(ev.clientY-r.top+12)+"px";tip.current.textContent=hit.object.userData.t+" · "+hit.object.userData.s;if(click)onSelect(hit.object.userData.t)}else{renderer.domElement.style.cursor=drag?"grabbing":"grab";tip.current.style.display="none"}}
  const down=e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};const move=e=>{if(drag){ry+=(e.clientX-px)*.006;rx+=(e.clientY-py)*.004;rx=Math.max(-.65,Math.min(.35,rx));px=e.clientX;py=e.clientY;group.rotation.set(rx,ry,0)}else pick(e,false)};const up=e=>{drag=false;pick(e,true)};const wheel=e=>{e.preventDefault();dist=Math.max(.72,Math.min(1.5,dist+Math.sign(e.deltaY)*.08));cam.position.set(12*dist,13*dist,18*dist)};
  renderer.domElement.addEventListener("pointerdown",down);renderer.domElement.addEventListener("pointermove",move);renderer.domElement.addEventListener("pointerup",up);renderer.domElement.addEventListener("wheel",wheel,{passive:false});
  let af;const loop=()=>{af=requestAnimationFrame(loop);renderer.render(scene,cam)};loop();
  return()=>{cancelAnimationFrame(af);ro.disconnect();renderer.dispose();el.removeChild(renderer.domElement)};
 },[items,selected]);
 return h("div",{ref:mount,style:{width:"100%",height:"100%",position:"relative"}},h("div",{ref:tip,className:"tooltip"}));
}
function App(){
 const sectors=["全部",...Array.from(new Set(stocks.map(x=>x.s)))];
 const [sector,setSector]=useState("全部"),[min,setMin]=useState(65),[sel,setSel]=useState("NVDA");
 const filtered=useMemo(()=>stocks.filter(x=>(sector==="全部"||x.s===sector)&&x.e>=min),[sector,min]);
 const chosen=stocks.find(x=>x.t===sel)||filtered[0]||stocks[0];
 const ranked=[...filtered].sort((a,b)=>((b.v+b.q+b.c+b.e)/4)-((a.v+a.q+a.c+a.e)/4));
 const score=d=>Math.round((d.v+d.q+d.c+d.e)/4);
 return h("div",{className:"app"},
   h("div",{className:"top"},
     h("div",null,h("div",{className:"eyebrow"},"TRQUANT · 3D STOCK MAP"),h("div",{className:"title"},"交互式 3D 选股地图"),h("div",{className:"sub"},"Demo 数据 · X=预期差 · Y=财富创造能力 · Z=状态/催化 · 球大小=非对称性")),
     h("div",{className:"metrics"},h("div",{className:"metric"},h("span",null,"可见标的"),h("b",null,String(filtered.length))),h("div",{className:"metric"},h("span",null,"Evidence 阈值"),h("b",null,min+"+")),h("div",{className:"metric"},h("span",null,"最高机会分"),h("b",null,ranked[0]?score(ranked[0]):"—")))
   ),
   h("div",{className:"grid"},
    h("aside",{className:"panel side"},h("div",{className:"section"},"行业过滤"),h("div",{className:"chips"},...sectors.map(s=>h("button",{className:"chip "+(s===sector?"active":""),onClick:()=>setSector(s)},s))),h("div",{className:"section",style:{marginTop:18}},"最低 Evidence："+min),h("input",{className:"range",type:"range",min:40,max:95,value:min,onChange:e=>setMin(+e.target.value)}),h("p",{className:"hint"},"拖拽旋转，滚轮缩放，点击球体锁定标的。当前仅演示交互模型，正式版接 TRQuant canonical snapshot。"),h("div",{className:"section",style:{marginTop:18}},"机会雷达"),h("div",{className:"rank"},...ranked.slice(0,7).map(d=>h("button",{onClick:()=>setSel(d.t)},h("b",null,d.t+" · "+d.n),h("small",null,d.s+" · 机会分 "+score(d)))))),
    h("main",{className:"panel stage"},h(ThreeMap,{items:filtered,onSelect:setSel,selected:sel}),h("div",{className:"legend"},"空间含义：横向 = 预期差　｜　垂直 = 财富创造能力　｜　纵深 = 状态/催化",h("br"),"颜色 = 行业　｜　球大小 = 非对称性　｜　筛选 = Evidence")),
    h("aside",{className:"panel detail"},h("div",{className:"ticker"},chosen.t),h("div",{className:"company"},chosen.n+" · "+chosen.s),h("span",{className:"badge"},"研究对象 · 非交易指令"),h("div",{className:"score"},score(chosen)),h("div",{className:"scorelab"},"综合机会分（Demo）"),h("div",{className:"bars"},...[["预期差",chosen.v],["财富创造",chosen.q],["状态/催化",chosen.c],["Evidence",chosen.e],["非对称性",chosen.a]].map(([k,v])=>h("div",{className:"barrow"},h("span",null,k),h("div",{className:"track"},h("div",{className:"fill",style:{width:v+"%"}})),h("b",null,v)))),h("div",{className:"notes"},"正式版下一步：把 Demo scores 换成 Equity Research / Prepared Opportunity / Market Risk 的机器可读字段，并让点击标的直接进入 Investment Case 研究链。"))
   )
 );
}
createRoot(document.getElementById("root")).render(h(App));
</script>
