<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>朱氏六代 3D 家族树</title>
<style>
html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:#07101c;font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;color:#eef5ff}
*{box-sizing:border-box}button,input,select{font:inherit}
.app{height:100vh;display:grid;grid-template-rows:58px 36px 1fr;background:radial-gradient(circle at 50% 20%,#0e2237 0%,#07101c 55%,#050a11 100%)}
.header{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid rgba(160,194,226,.12);background:rgba(8,19,31,.92);backdrop-filter:blur(10px)}
.brand{font-weight:800}.brand small{display:block;font-size:9px;color:#6f89a2;letter-spacing:.12em}
.stats{margin-left:auto;display:flex;gap:14px;font-size:10px;color:#7890a7}.stats b{color:#fff;font-size:14px}
.bar{display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(9,20,33,.85);border-bottom:1px solid rgba(160,194,226,.08);font-size:10px;color:#758ca2}
.workspace{display:grid;grid-template-columns:220px 1fr 280px;min-height:0}
.left,.right{background:linear-gradient(180deg,rgba(12,26,42,.94),rgba(7,16,28,.96));overflow:auto;padding:16px;backdrop-filter:blur(8px)}
.left{border-right:1px solid rgba(160,194,226,.12)}.right{border-left:1px solid rgba(160,194,226,.12)}
h2,h3{margin:5px 0 10px}.muted{color:#7890a7;font-size:11px;line-height:1.6}
.nav button,.control button{width:100%;display:flex;gap:9px;align-items:center;padding:9px;border:1px solid transparent;border-radius:10px;background:transparent;color:#b9c8d7;text-align:left;margin:4px 0;cursor:pointer}
.nav button:hover,.nav button.active,.control button:hover,.control button.active{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.09)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor}
.section-title{margin-top:18px;font-size:10px;letter-spacing:.1em;color:#658098}
.toggle{display:flex;justify-content:space-between;align-items:center}
.toggle .pill{width:34px;height:18px;border-radius:20px;background:#24384c;position:relative;transition:.2s}
.toggle .pill:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;top:3px;left:3px;background:#9fb2c5;transition:.2s}
.toggle.active .pill{background:#7f3041}.toggle.active .pill:after{left:19px;background:#fff}
.world{display:grid;grid-template-rows:54px 1fr 60px;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(160,194,226,.08);background:rgba(9,20,33,.78);backdrop-filter:blur(8px)}
.toolbar button{margin-left:6px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(255,255,255,.035);color:#a7bbcd;padding:6px 9px;font-size:9px;cursor:pointer}
.scene{position:relative;min-height:0;overflow:hidden}
.scene-host{position:absolute;inset:0}.labels{position:absolute;inset:0;pointer-events:none}
.label{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;padding:4px 7px;border-radius:8px;border:1px solid rgba(210,230,245,.14);background:rgba(7,16,28,.36);color:#dfeafa;font-size:9px;white-space:nowrap;backdrop-filter:blur(7px);transition:.18s;box-shadow:0 4px 18px rgba(0,0,0,.1)}
.label:hover{background:rgba(10,22,36,.7);transform:translate(-50%,-50%) scale(1.06)}
.label.direct{border-color:rgba(255,93,115,.5);color:#ffe3e8;box-shadow:0 0 16px rgba(255,93,115,.08)}
.label.dimmed{opacity:.18}.label.pending{opacity:.5;border-style:dashed}
.bottom{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid rgba(160,194,226,.08);background:rgba(9,20,33,.82)}
.bottom input{width:280px;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:8px;background:#0b1828;color:#fff}
.tag{display:inline-block;padding:4px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.08);font-size:9px;color:#9db1c4;margin-right:5px}
.tag.direct{border-color:rgba(255,93,115,.35);color:#ffdce2}
.right dl{font-size:10px}.right dt{margin-top:11px;color:#6f879e}.right dd{margin:3px 0 0;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.05);line-height:1.5}
.focus{width:100%;margin-top:12px;padding:8px;border:1px solid rgba(255,93,115,.3);border-radius:9px;background:rgba(255,93,115,.08);color:#ffe3e8;cursor:pointer}
.hint{position:absolute;left:10px;bottom:10px;padding:5px 8px;border-radius:999px;background:rgba(5,13,23,.54);font-size:8px;color:#71889d;backdrop-filter:blur(5px)}
.orient{position:absolute;left:50%;top:10px;transform:translateX(-50%);padding:5px 8px;border:1px solid rgba(255,255,255,.06);border-radius:999px;background:rgba(5,13,23,.48);font-size:8px;color:#7890a7;backdrop-filter:blur(4px)}
.legend{display:flex;gap:9px;flex-wrap:wrap;font-size:9px;color:#778da2;margin-top:10px}.legend span{display:flex;align-items:center;gap:5px}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.left{display:none}.right{position:absolute;right:8px;bottom:8px;width:260px;max-height:40vh;border:1px solid rgba(160,194,226,.15);border-radius:12px;z-index:9}.stats{display:none}}
</style>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body><div id="root"></div>

const gy={1:38,2:23,3:8,4:-7,5:-22,6:-37};const bx={root:0,eldest:-54,main:-14,third:18,fourth:36,fifth:55,daughter:74};
function pos(n){if(n.id==='h1')return new Vector3(0,gy[n.g],0);if(n.main)return new Vector3(0,gy[n.g],0);const same=nodes.filter(x=>x.b===n.b&&x.g===n.g),k=same.indexOf(n);return new Vector3((bx[n.b]||0)+(k-(same.length-1)/2)*7,gy[n.g],(k%2?1:-1)*Math.floor((k+1)/2)*7.5)}

function Family(){const host=useRef(),api=useRef({});const[sel,setSel]=useState('m1111'),[filter,setFilter]=useState('all'),[directOnly,setDirectOnly]=useState(false),[highlight,setHighlight]=useState(true),[showPending,setShowPending]=useState(true),[motion,setMotion]=useState(true),[q,setQ]=useState('');const visible=useMemo(()=>new Set(nodes.filter(n=>(!directOnly||n.main)&&(filter==='all'||n.b===filter||n.id==='h1')&&(showPending||!n.pending)).map(n=>n.id)),[filter,directOnly,showPending]);const selected=nodes.find(n=>n.id===sel);
useEffect(()=>{const h=host.current,scene=new Scene();scene.background=new Color('#07101c');scene.add(new AmbientLight('#bedcff',1.5));const dl=new DirectionalLight('#fff',3);dl.position.set(20,30,30);scene.add(dl);const camera=new PerspectiveCamera(48,1,.1,500);const renderer=new WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));h.appendChild(renderer.domElement);const controls=new OrbitControls(camera,h);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=20;controls.maxDistance=180;const groupMap=new Map(),pick=[];nodes.forEach(n=>{if(!visible.has(n.id))return;const g=new Group();g.position.copy(pos(n));scene.add(g);const dim=highlight&&!n.main;const mat=new MeshStandardMaterial({color:n.main?'#ff5d73':branch[n.b][1],roughness:.35,metalness:.12,transparent:true,opacity:dim?.25:(n.pending?.55:.96),emissive:new Color(n.main?'#3d0b14':'#07101c'),emissiveIntensity:n.main?.9:.15});const sphere=new Mesh(new SphereGeometry(n.main?1.55:1.15,24,18),mat);sphere.userData.id=n.id;g.add(sphere);pick.push(sphere);if(n.main){const halo=new Mesh(new TorusGeometry(2.1,.09,8,48),new MeshStandardMaterial({color:'#ff8b9b',emissive:'#6a1724',emissiveIntensity:1.5,transparent:true,opacity:.7}));halo.rotation.x=Math.PI/2;halo.userData.isHalo=true;g.add(halo)}groupMap.set(n.id,{g,n})});const tubes=[];links.forEach(([a,b])=>{if(!groupMap.has(a)||!groupMap.has(b))return;const A=groupMap.get(a).g.position,B=groupMap.get(b).g.position,direct=groupMap.get(a).n.main&&groupMap.get(b).n.main,curve=curveFor(A,B);const tube=new Mesh(new TubeGeometry(curve,32,direct?.11:.055,6,false),new MeshStandardMaterial({color:direct?'#ff6077':'#53728c',emissive:direct?'#5d1221':'#08131e',emissiveIntensity:direct?1.4:.25,transparent:true,opacity:highlight&&!direct?.12:(direct?.9:.38),roughness:.45}));scene.add(tube);tubes.push({curve,direct})});const flow=[];tubes.filter(x=>x.direct).forEach((x,idx)=>{for(let i=0;i<3;i++){const p=new Mesh(new Sphere
