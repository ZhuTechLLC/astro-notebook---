function ramp(v,stops){v=clamp(v,0,1);for(let i=1;i<stops.length;i++){if(v<=stops[i][0]){const [p0,c0]=stops[i-1],[p1,c1]=stops[i],t=(v-p0)/(p1-p0||1);return new THREE.Color(c0).lerp(new THREE.Color(c1),t);}}return new THREE.Color(stops.at(-1)[1]);}
const GROWTH_RAMP=[[0,'#18345c'],[.48,'#168d99'],[.76,'#58c3aa'],[1,'#f0df8a']];
const VAL_RAMP=[[0,'#27679a'],[.50,'#68b8ad'],[.72,'#d0c979'],[1,'#df7d60']];
const RISK_RAMP=[[0,'#143b4b'],[.48,'#4d9a91'],[.72,'#d19a52'],[1,'#d65f57']];
function terrainColorAt(x,z){
  let base;
  if(mode==='valuation'){const g=metricAt(x,z,d=>d.growth5Y??0);base=ramp(norm(g,-10,45),GROWTH_RAMP);}
  else if(mode==='growth'){const rel=metricAt(x,z,d=>Number.isFinite(d.forwardPE)?d.forwardPE/(benchmark.forwardPE||27.66):1);base=ramp(norm(rel,.35,2.3),VAL_RAMP);}
  else{const r=metricAt(x,z,d=>(d.lossRate??50)/100);base=ramp(r,RISK_RAMP);}
  const dom=dominantCategoryAt(x,z);
  if(dom?.cat&&dom.weight>.08){const meta=CATEGORY_META[dom.cat],c1=new THREE.Color(meta.color),c2=new THREE.Color(meta.accent);const texture=.5+.5*Math.sin(dom.local.u*7+dom.local.v*5);base.lerp(texture>.52?c2:c1,.10+.18*dom.weight);}
  return base;
}
function disposeObject(obj){obj?.traverse?.(o=>{o.geometry?.dispose?.();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose?.());else o.material.dispose?.();}});}

const wrap=document.getElementById('canvasWrap');
const scene=new THREE.Scene();scene.background=new THREE.Color('#050b11');scene.fog=new THREE.Fog('#050b11',18,46);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,100);camera.position.set(17,16,22);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;wrap.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=6;controls.maxDistance=42;controls.maxPolarAngle=Math.PI/2.08;controls.target.set(0,1.2,0);
let cameraTarget=new THREE.Vector3(0,1.2,0);
scene.add(new THREE.AmbientLight('#e3fbff',.48));const hemi=new THREE.HemisphereLight('#c8f4ff','#071118',.85);scene.add(hemi);const dir=new THREE.DirectionalLight('#ffffff',1.35);dir.position.set(9,16,8);dir.castShadow=true;dir.shadow.mapSize.set(2048,2048);scene.add(dir);const point=new THREE.PointLight('#58d8f5',16,22);point.position.set(-13,8,-5);scene.add(point);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(42,34),new THREE.MeshStandardMaterial({color:'#061019',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);const grid=new THREE.GridHelper(36,36,'#1f5161','#102933');grid.position.y=.02;scene.add(grid);

let terrain=null,nodesGroup=null,particles=null,categoryLabels=null,seaGroup=null,territoryGroup=null,relationGroup=null;
let nodeMeshes=[],signalRings=[],relationFlows=[];
function buildTerrain(){
  if(terrain){scene.remove(terrain);disposeObject(terrain);}const cols=100,rows=76,minX=-17,maxX=17,minZ=-13,maxZ=13,pos=[],colsArr=[],idx=[];
  for(let iz=0;iz<rows;iz++){const z=minZ+(maxZ-minZ)*iz/(rows-1);for(let ix=0;ix<cols;ix++){const x=minX+(maxX-minX)*ix/(cols-1),y=fieldHeight(x,z),c=terrainColorAt(x,z);const density=metricAt(x,z,d=>1);c.multiplyScalar(.58+.42*clamp(density,0,1));pos.push(x,y,z);colsArr.push(c.r,c.g,c.b);}}
  for(let z=0;z<rows-1;z++)for(let x=0;x<cols-1;x++){const a=z*cols+x,b=a+1,c=a+cols,d=c+1;idx.push(a,c,b,b,c,d);}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colsArr,3));g.setIndex(idx);g.computeVertexNormals();terrain=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.84,metalness:.04,side:THREE.DoubleSide}));terrain.receiveShadow=true;scene.add(terrain);
}
function makeLabelSprite(text,color='#8bdcec',scale=3.5){const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='rgba(4,15,22,.76)';x.roundRect(20,24,472,78,20);x.fill();x.strokeStyle='rgba(120,215,232,.22)';x.lineWidth=2;x.stroke();x.font='700 34px sans-serif';x.fillStyle=color;x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,64);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,opacity:.88}));s.scale.set(scale,.88,1);return s;}
function buildCategoryLabels(){if(categoryLabels){scene.remove(categoryLabels);disposeObject(categoryLabels);}categoryLabels=new THREE.Group();for(const c of CATEGORY_ORDER){if(activeCategory!=='全部'&&activeCategory!==c)continue;const ns=currentNodes.filter(d=>d.category===c);if(!ns.length)continue;const [x,z]=CATEGORY_ANCHORS[c],y=Math.min(5.4,Math.max(...ns.map(nodeHeight))+.46),s=makeLabelSprite(c,CATEGORY_META[c]?.accent||'#8bdcec');s.position.set(x,y,z);categoryLabels.add(s);}scene.add(categoryLabels);}
function buildTerritories(){
  if(territoryGroup){scene.remove(territoryGroup);disposeObject(territoryGroup);}territoryGroup=new THREE.Group();
  for(const c of CATEGORY_ORDER){
    if(activeCategory!=='全部'&&activeCategory!==c)continue;
    const meta=CATEGORY_META[c],pts=territoryOutline(c);
    const fill=conformalShapeMesh(pts,meta.color,.15);territoryGroup.add(fill);
    const dark=conformalTube(pts,'#071017',.070,.72);territoryGroup.add(dark);
    const edge=conformalTube(pts,meta.accent,.028,.95);territoryGroup.add(edge);
  }
  scene.add(territoryGroup);
}
function buildRelations(){
  if(relationGroup){scene.remove(relationGroup);disposeObject(relationGroup);relationGroup=null;}relationFlows=[];
  if(!showRelations)return;
  relationGroup=new THREE.Group();
  for(const rel of CATEGORY_RELATIONS){
    const {a,b,w,type}=rel;if(!activeRelationTypes.has(type))continue;
    if(activeCategory!=='全部'&&activeCategory!==a&&activeCategory!==b)continue;
    const pa=CATEGORY_ANCHORS[a],pb=CATEGORY_ANCHORS[b],meta=RELATION_META[type];
    const y1=fieldHeight(pa[0],pa[1])+.34,y2=fieldHeight(pb[0],pb[1])+.34;
    const mid=new THREE.Vector3((pa[0]+pb[0])/2,Math.max(y1,y2)+1.15+1.9*w,(pa[1]+pb[1])/2);
    const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(pa[0],y1,pa[1]),mid,new THREE.Vector3(pb[0],y2,pb[1]));
    const pts=curve.getPoints(52),g=new THREE.BufferGeometry().setFromPoints(pts);
    let mat;if(meta.dash>0){mat=new THREE.LineDashedMaterial({color:meta.color,transparent:true,opacity:.34+.36*w,dashSize:meta.dash,gapSize:meta.gap,scale:1});}else{mat=new THREE.LineBasicMaterial({color:meta.color,transparent:true,opacity:.30+.40*w});}
    const line=new THREE.Line(g,mat);if(meta.dash>0)line.computeLineDistances();relationGroup.add(line);
    const glow=new THREE.Mesh(new THREE.SphereGeometry(.075+.035*w,12,12),new THREE.MeshBasicMaterial({color:meta.color,transparent:true,opacity:.88,depthWrite:false}));glow.userData={curve,phase:(a.length+b.length)*.071,speed:meta.speed*(.75+.5*w),type};relationGroup.add(glow);relationFlows.push(glow);
  }
  scene.add(relationGroup);
}
function buildSeaLevel(){if(seaGroup){scene.remove(seaGroup);disposeObject(seaGroup);seaGroup=null;}if(mode!=='valuation')return;seaGroup=new THREE.Group();const plane=new THREE.Mesh(new THREE.PlaneGeometry(34,26),new THREE.MeshPhysicalMaterial({color:'#2a91ad',transparent:true,opacity:.10,roughness:.32,metalness:.05,side:THREE.DoubleSide,depthWrite:false}));plane.rotation.x=-Math.PI/2;plane.position.y=SEA_LEVEL;seaGroup.add(plane);const label=makeLabelSprite(`市场海平面 · Forward PE ${fmt(benchmark.forwardPE)}×`,'#a9edf8',4.6);label.position.set(-10.8,SEA_LEVEL+.16,10.7);seaGroup.add(label);scene.add(seaGroup);}
function addPegRing(group,d,y){const r=.36;const bg=new THREE.Mesh(new THREE.RingGeometry(r,r+.018,52),new THREE.MeshBasicMaterial({color:'#637983',transparent:true,opacity:.17,side:THREE.DoubleSide}));bg.rotation.x=Math.PI/2;bg.position.set(d.x,y-.02,d.z);group.add(bg);if(!Number.isFinite(d.peg)){for(let i=0;i<6;i++){const g=new THREE.RingGeometry(r,r+.025,16,1,i*Math.PI/3,.35),m=new THREE.MeshBasicMaterial({color:'#788c94',transparent:true,opacity:.45,side:THREE.DoubleSide}),seg=new THREE.Mesh(g,m);seg.rotation.x=Math.PI/2;seg.position.set(d.x,y-.015,d.z);group.add(seg);}return;}let frac,color,opacity;if(d.peg<1){frac=1;color='#78efb5';opacity=.95;}else if(d.peg<2){frac=.78;color='#9fe9f4';opacity=.85;}else if(d.peg<3){frac=.52;color='#e8c874';opacity=.80;}else{frac=.26;color='#f08a69';opacity=.78;}const g=new THREE.RingGeometry(r,r+.032,52,1,-Math.PI/2,Math.PI*2*frac),m=new THREE.MeshBasicMaterial({color,transparent:true,opacity,side:THREE.DoubleSide}),arc=new THREE.Mesh(g,m);arc.rotation.x=Math.PI/2;arc.position.set(d.x,y-.01,d.z);group.add(arc);}
function buildNodes(){
  if(nodesGroup){scene.remove(nodesGroup);disposeObject(nodesGroup);}nodesGroup=new THREE.Group();nodeMeshes=[];signalRings=[];const sphereG=new THREE.SphereGeometry(1,18,18);
  for(const d of currentNodes){const y=nodeHeight(d)+.16,isLens=d.mismatchScore>=90,size=.12+.16*norm(Math.log1p(d.firms??1),Math.log(2),Math.log(570));let color=selected?.industry===d.industry?'#ffffff':'#9ae6ef';if(showLens&&isLens)color='#f3d77b';const tc=new THREE.Color(color),mat=new THREE.MeshStandardMaterial({color:tc,emissive:tc,emissiveIntensity:showLens&&isLens?1.05:.34}),m=new THREE.Mesh(sphereG.clone(),mat);m.scale.setScalar(size);m.position.set(d.x,y,d.z);m.userData.data=d;m.castShadow=true;nodesGroup.add(m);nodeMeshes.push(m);if(showPeg)addPegRing(nodesGroup,d,y);
    if(showLens&&isLens){const rg=new THREE.RingGeometry(.48,.53,48),rm=new THREE.MeshBasicMaterial({color:'#ffd76b',transparent:true,opacity:.78,side:THREE.DoubleSide}),ring=new THREE.Mesh(rg,rm);ring.rotation.x=Math.PI/2;ring.position.set(d.x,y+.02,d.z);ring.userData.phase=d.id;nodesGroup.add(ring);signalRings.push(ring);const beam=new THREE.Mesh(new THREE.CylinderGeometry(.028,.09,1.35,12,1,true),new THREE.MeshBasicMaterial({color:'#ffd76b',transparent:true,opacity:.20,side:THREE.DoubleSide,depthWrite:false}));beam.position.set(d.x,y+.72,d.z);nodesGroup.add(beam);}
  }scene.add(nodesGroup);
}
function buildParticles(){if(particles){scene.remove(particles);disposeObject(particles);particles=null;}if(!showParticles)return;const pos=[],col=[];for(const d of currentNodes){const loss=d.lossRate??0,count=Math.max(1,Math.round(loss/5.7)),y0=nodeHeight(d)+.28;for(let i=0;i<count;i++){const a=(i*2.399963+d.id*.37),r=.17+.055*i+(.12*Math.sin(i*1.7+d.id));pos.push(d.x+Math.cos(a)*Math.min(r,.95),y0+.12+(i%5)*.10,d.z+Math.sin(a)*Math.min(r,.95));const c=ramp(loss/100,RISK_RAMP);col.push(c.r,c.g,c.b);}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));particles=new THREE.Points(g,new THREE.PointsMaterial({size:.075,sizeAttenuation:true,transparent:true,opacity:.72,vertexColors:true,depthWrite:false}));scene.add(particles);}
function rebuildWorld(){currentNodes=activeCategory==='全部'?allNodes:allNodes.filter(d=>d.category===activeCategory);if(selected&&activeCategory!=='全部'&&selected.category!==activeCategory)selected=null;buildTerrain();buildTerritories();buildSeaLevel();buildRelations();buildCategoryLabels();buildNodes();buildParticles();renderPanel();renderModeUI();renderRanks();}

function metricPill(label,value,tone=''){return `<div class="metric-pill ${tone}"><span>${label}</span><b>${value}</b></div>`;}
function renderBenchmark(){document.getElementById('benchmarkStrip').innerHTML=[metricPill('市场海平面',`${fmt(benchmark?.forwardPE)}×`,'pe'),metricPill('5Y EPS 增长',`${fmt(benchmark?.growth5Y)}%`,'growth'),metricPill('亏损公司',`${fmt(benchmark?.lossRate)}%`,'risk'),metricPill('PEG',fmt(benchmark?.peg),'peg')].join('');}
function renderLossGrid(v){const n=clamp(Math.round(v??0),0,100);return `<div class="loss-matrix-wrap"><div class="loss-matrix-head"><span>亏损公司点阵</span><b>${n} / 100</b></div><div class="loss-grid">${Array.from({length:100},(_,i)=>`<i class="loss-dot ${i<n?'on':''}"></i>`).join('')}</div></div>`;}
function renderPanel(){const p=document.getElementById('rightPanel');if(!selected){p.innerHTML='<div class="empty-card"><div class="orb"></div><h2>选择一个行业</h2><p>每个板块都有独立边界、颜色和地貌语法；板块之间的发光通道表示资本、产业链或需求传导关系。点击行业节点查看完整数据；拖动旋转，滚轮缩放。</p></div>';return;}const typeClass=selected.mismatchType==='正向错配候选'?'good':selected.mismatchType==='估值压力'?'warn':'';const caution=(selected.lossRate??0)>=70?'高亏损率':(selected.growth5Y??0)>=40?'增长预期极值':'需结合基本面';const meta=CATEGORY_META[selected.category]||{};p.innerHTML=`<div class="industry-head"><span>${selected.category} · ${selected.cluster}</span><h2>${selected.industry}</h2><div class="score-line"><b class="${selected.mismatchType==='估值压力'?'pressure':selected.mismatchType==='接近基准'?'neutral':''}">${selected.mismatchScore}</b><small>估值错配指数 / 100</small></div><div><span class="status-chip ${typeClass}">${selected.mismatchType}</span><span class="status-chip">${caution}</span></div></div><div class="metric-grid">${metricPill('Forward PE',`${fmt(selected.forwardPE)}×`,'pe')}${metricPill('5Y EPS 增长',`${fmt(selected.growth5Y)}%`,'growth')}${metricPill('PEG',fmt(selected.peg),'peg')}${metricPill('亏损公司',`${fmt(selected.lossRate)}%`,'risk')}${metricPill('公司数',selected.firms??'NA')}${metricPill('Trailing PE',`${fmt(selected.trailingPE)}×`)}</div><div class="readout"><div><span>相对市场 Forward PE</span><b>${Number.isFinite(selected.forwardPE)?fmt(selected.forwardPE/(benchmark?.forwardPE||1),2)+'×':'NA'}</b></div><div><span>相对市场增长</span><b>${Number.isFinite(selected.growth5Y)?fmt(selected.growth5Y/(benchmark?.growth5Y||1),2)+'×':'NA'}</b></div><div><span>当前海拔映射</span><b>${fmt(nodeHeight(selected),2)}</b></div></div>${renderLossGrid(selected.lossRate)}<div class="semantic-readout"><b>板块地貌：</b>${meta.biome||'—'} · ${meta.landform||'—'}<br><b>板块逻辑：</b>${meta.note||'行业位置由产业链/商业模式关系固定。'}<br><b>空间语义：</b>行业位置由产业链/商业模式关系固定，PE、增长和亏损率变化不会搬动行业。</div><div class="note">“估值错配指数”只表示 Damodaran 横截面里的增长—估值异常，不等于投资机会。结构变化、ROIC、资本强度、催化剂、State 与可执行性必须进入 TRQuant Investment Case 后再判断。</div>`;}
function renderModeUI(){document.getElementById('modeExplain').innerHTML=`<b>${MODE_META[mode].label}</b><p>${MODE_META[mode].desc}</p>`;document.querySelectorAll('#modeSwitch button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const sea=mode==='valuation'?'<div><span class="dot altitude"></span>海平面：市场 Forward PE 27.66×</div>':'';const rel=showRelations?'<div><span class="link-icon"></span>板块关系：资本 / 产业链 / 需求传导</div>':'';document.getElementById('legend').innerHTML=`${sea}<div><span class="dot growth"></span>颜色：${MODE_META[mode].color}</div><div><span class="territory-icon"></span>边界：板块领地轮廓</div>${rel}<div><span class="dot particles"></span>点阵：亏损率</div><div><span class="ring-icon"></span>PEG 环：越完整越低</div><div><span class="signal-icon"></span>金色信标：估值错配候选</div>`;document.querySelector('.opportunity-dock')?.classList.toggle('lens-off',!showLens);}
function renderRelationTypes(){const el=document.getElementById('relationTypeChips');if(!el)return;el.innerHTML=Object.entries(RELATION_META).map(([key,m])=>`<button data-rel="${key}" class="${activeRelationTypes.has(key)?'active':''}"><i style="background:${m.color}"></i>${m.label}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.rel;if(activeRelationTypes.has(k))activeRelationTypes.delete(k);else activeRelationTypes.add(k);renderRelationTypes();buildRelations();renderModeUI();});}
function renderCategories(){const c=document.getElementById('categoryChips');c.innerHTML=['全部',...CATEGORY_ORDER].map(x=>`<button data-cat="${x}" class="${activeCategory===x?'active':''}">${x}</button>`).join('');c.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;renderCategories();rebuildWorld();});}
function renderRanks(){const r=document.getElementById('rankList');const list=activeCategory==='全部'?topNodes:allNodes.filter(d=>d.category===activeCategory).sort((a,b)=>b.mismatchScore-a.mismatchScore).slice(0,10);r.innerHTML=list.map((d,i)=>`<button data-id="${d.id}" class="${selected?.id===d.id?'active':''}"><i>${String(i+1).padStart(2,'0')}</i><span><b>${d.industry}</b><small>${d.category} · PE ${fmt(d.forwardPE,1)}× · 增长 ${fmt(d.growth5Y,1)}%${(d.lossRate??0)>70?' · 高亏损':''}</small></span><strong>${d.mismatchScore}</strong></button>`).join('');r.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory='全部';renderCategories();selected=allNodes[+b.dataset.id];rebuildWorld();focusSelected();});}
function renderSearch(q){const el=document.getElementById('searchResults'),s=q.trim().toLowerCase();if(!s){el.classList.add('hidden');el.innerHTML='';return;}const hits=allNodes.filter(d=>d.industry.toLowerCase().includes(s)).slice(0,8);if(!hits.length){el.classList.add('hidden');return;}el.innerHTML=hits.map(d=>`<button data-id="${d.id}">${d.industry}<span>${d.category}</span></button>`).join('');el.classList.remove('hidden');el.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCategory='全部';renderCategories();selected=allNodes[+b.dataset.id];document.getElementById('searchInput').value='';el.classList.add('hidden');rebuildWorld();focusSelected();});}
function focusSelected(){if(!selected)return;cameraTarget.set(selected.x,nodeHeight(selected),selected.z);}
function resetView(){selected=null;renderPanel();camera.position.set(17,16,22);cameraTarget.set(0,1.5,0);buildNodes();renderRanks();}

renderBenchmark();renderCategories();renderRelationTypes();renderModeUI();renderPanel();rebuildWorld();
document.querySelectorAll('#modeSwitch button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;rebuildWorld();if(selected)focusSelected();});
document.getElementById('searchInput').addEventListener('input',e=>renderSearch(e.target.value));
document.getElementById('toggleParticles').onchange=e=>{showParticles=e.target.checked;buildParticles();};
document.getElementById('togglePeg').onchange=e=>{showPeg=e.target.checked;buildNodes();};
document.getElementById('toggleSignals').onchange=e=>{showLens=e.target.checked;buildNodes();renderModeUI();renderRanks();};
document.getElementById('toggleRelations').onchange=e=>{showRelations=e.target.checked;document.getElementById('relationTypeChips').style.opacity=showRelations?'1':'.28';buildRelations();renderModeUI();};
document.getElementById('resetCamera').onclick=resetView;
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=null;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const rect=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(nodeMeshes,false);if(hits.length){selected=hits[0].object.userData.data;renderPanel();buildNodes();renderRanks();focusSelected();}else{selected=null;renderPanel();buildNodes();renderRanks();cameraTarget.set(0,1.5,0);}});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();controls.target.lerp(cameraTarget,.055);controls.update();for(const r of signalRings){const q=1+.20*Math.sin(t*2.6+r.userData.phase);r.scale.setScalar(q);}for(const f of relationFlows){const u=(t*f.userData.speed+f.userData.phase)%1;f.position.copy(f.userData.curve.getPointAt(u));const q=.85+.35*Math.sin(t*5+f.userData.phase*12);f.scale.setScalar(q);}renderer.render(scene,camera);}animate();
